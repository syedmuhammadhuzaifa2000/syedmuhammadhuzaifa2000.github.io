<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Languages | SM Huzaifa</title>

  <link rel="icon" type="image/png" href="/Images/Website-ICON/favicon.png?v=3">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Layout CSS -->
  <link href="/Code/Layout/layout.css" rel="stylesheet">
  <link href="/Code/Languages/languages.css" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body {
      background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url("../../Images/Background-Photos/bg-languages.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>

<body>

<div id="nav-container"></div>

<main class="page-content languages-page">

  <h1 class="languages-title">Languages</h1>

  <div class="languages-grid">

    <!-- Linguistic -->
   <div class="donut-card">
  <svg class="donut" viewBox="0 0 120 120">
    <circle class="donut-bg" cx="60" cy="60" r="48"/>
    <circle class="donut-ring" cx="60" cy="60" r="48"
            style="stroke-dashoffset: 60;"></circle>
  </svg>

  <div class="donut-core">
    <h6>Linguistic</h6>
    <p>Proficiency</p>
  </div>

  <div class="donut-label">
    English&nbsp;&nbsp;Urdu&nbsp;&nbsp;Chinese
  </div>
</div>


    <!-- Programming -->
    <div class="donut-card">
  <svg class="donut" viewBox="0 0 120 120">
    <circle class="donut-bg" cx="60" cy="60" r="48"/>
    <circle class="donut-ring" cx="60" cy="60" r="48"
            style="stroke-dashoffset: 80;"></circle>
  </svg>

  <div class="donut-core">
    <h6>Programming</h6>
    <p>Languages</p>
  </div>

  <div class="donut-label">
    Python&nbsp;&nbsp;C++&nbsp;&nbsp;Java
  </div>
</div>


    <!-- Web -->
    <div class="donut-card">
  <svg class="donut" viewBox="0 0 120 120">
    <circle class="donut-bg" cx="60" cy="60" r="48"/>
    <circle class="donut-ring" cx="60" cy="60" r="48"
            style="stroke-dashoffset: 80;"></circle>
  </svg>

  <div class="donut-core">
    <h6>Web & Data</h6>
    </div>

  <div class="donut-label">
    CSS&nbsp;&nbsp;HTML&nbsp;&nbsp;PHP&nbsp;&nbsp;JS
  </div>
</div>

</main>

<div id="footer-container"></div>

<script src="/Code/Layout/layout.js"></script>

<script>
  fetch("/Code/Layout/layout.html")
    .then(r => r.text())
    .then(html => {
      const temp = document.createElement("div");
      temp.innerHTML = html;

      document.getElementById("nav-container").append(
        temp.querySelector(".top-navbar"),
        temp.querySelector(".side-navbar")
      );

      document.getElementById("footer-container").append(
        temp.querySelector(".footer")
      );

      document.body.appendChild(temp.querySelector("#cnicPopup"));
      temp.querySelectorAll(".modal").forEach(m => document.body.appendChild(m));
    });
</script>

</body>
</html>
