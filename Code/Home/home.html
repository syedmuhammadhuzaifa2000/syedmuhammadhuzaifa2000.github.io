<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SM Huzaifa</title>

  <link rel="icon" type="image/png" href="/Images/website-ICON/favicon.png">

  <link rel="preload" as="image" href="/Images/Background-Photos/bg-home.jpeg">


  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Layout CSS -->
  <link href="/Code/Layout/layout.css" rel="stylesheet">
  <link href="/Code/Home/home.css" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Page Background -->
  <style>
    body {
      background-image: linear-gradient(rgba(0,0,0,0.09), rgba(0,0,0,0.1)),url("../../Images/Background-Photos/bg-home.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <div id="nav-container"></div>

  <!-- PAGE CONTENT -->
  <main class="page-content">
    <section class="home-hero">
      <div class="hero-card">
        <h1>Welcome to My Portfolio</h1>

        <p class="typewriter-line">
          <span id="typewriter"></span><span class="cursor">|</span>
        </p>

        <div class="hero-actions">
          <a href="/Code/About/about.html" class="btn btn-primary">About Me</a>
          <a href="/Code/Experience/experience.html" class="btn btn-secondary">Explore My Work</a>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-container"></div>
  

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Layout JS -->
  <script src="/Code/Layout/layout.js"></script>

  <script src="/Code/Home/home.js"></script>

  <!-- Load shared layout -->
  <script>
    fetch("/Code/Layout/layout.html")
      .then(r => r.text())
      .then(html => {
        const temp = document.createElement("div");
        temp.innerHTML = html;

        // NAV
        document.getElementById("nav-container").append(
          temp.querySelector(".top-navbar"),
          temp.querySelector(".side-navbar")
        );

        // FOOTER
        document.getElementById("footer-container").append(
          temp.querySelector(".footer")
        );

        // POPUPS
        document.body.appendChild(temp.querySelector("#cnicPopup"));
        temp.querySelectorAll(".modal").forEach(m => document.body.appendChild(m));

        // Start typewriter
        if (typeof initTypewriter === "function") {
          initTypewriter();
        }
      })
      .catch(console.error);
  </script>

</body>
</html>
